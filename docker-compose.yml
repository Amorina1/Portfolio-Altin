version: "3.8"

services:
  app:
    build: .
    container_name: todo-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: todoapp
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: todo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoapp
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: