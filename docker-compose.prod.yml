version: "3.8"

services:
  app:
    image: amorina1/todo-app:latest
    container_name: todo-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: example
      DB_NAME: todo_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: todo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: todo_db
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
