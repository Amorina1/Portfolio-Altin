name: Docker Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/amorina1/portfolio-altin/todo-app:latest -f todo-app/Dockerfile .

      - name: Push Docker image
        run: docker push ghcr.io/amorina1/portfolio-altin/todo-app:latest

  test-contracts:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Vendos komandat e instalimit sipas gjuhës që përdor"

      - name: Run contract tests
        run: |
          npm install
          npm test