name: Docker Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/amorina1/portfolio-altin/todo-app:latest -f todo-app/Dockerfile .

      - name: Push Docker image
        run: docker push ghcr.io/amorina1/portfolio-altin/todo-app:latest

  test-contracts:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install   # ose komanda që përdor për gjuhën tënde

      - name: Run tests and save logs
        run: |
          mkdir -p dist
          npm test > dist/test-log.txt

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: dist/test-log.txt